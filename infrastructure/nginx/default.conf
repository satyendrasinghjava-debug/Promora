# Serves the React build and forwards API, tracking, upload and SEO paths to Spring Boot.
map $http_user_agent $is_crawler {
  default 0;
  "~*(googlebot|bingbot|duckduckbot|yandex|baiduspider|facebookexternalhit|twitterbot|linkedinbot|whatsapp|telegrambot|slackbot|discordbot)" 1;
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 6m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
  location /r/   { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
  location /files/ { proxy_pass http://backend:8080; }
  location = /sitemap.xml { proxy_pass http://backend:8080; }
  location = /robots.txt  { proxy_pass http://backend:8080; }
  location /seo/ { internal; proxy_pass http://backend:8080; }

  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  # Crawlers and link-preview fetchers get a small server-rendered snapshot (title, description, Open Graph, JSON-LD)
  # for public campaign, business and creator pages. People get the React app.
  location ~ ^/(campaigns|businesses|creators)/[^/]+$ {
    if ($is_crawler) { rewrite ^(.*)$ /seo/render?path=$1 last; }
    try_files $uri /index.html;
  }
  location / { try_files $uri /index.html; }
}
