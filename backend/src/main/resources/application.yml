spring:
  application:
    name: promora
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/promora}
    username: ${DB_USER:promora}
    password: ${DB_PASSWORD:promora}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: ${PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS:none}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: ${REDIS_ENABLED:false}
    mail:
      enabled: false
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
promora:
  public-url: ${PUBLIC_URL:http://localhost:5173}
  api-url: ${API_URL:http://localhost:8080}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
  jwt:
    secret: ${JWT_SECRET:}
    access-minutes: 15
    refresh-days: 14
  cookies-secure: ${COOKIES_SECURE:false}
  hash-salt: ${HASH_SALT:}
  auth:
    expose-dev-tokens: false
  ratelimit:
    enabled: true
  redis:
    enabled: ${REDIS_ENABLED:false}
  mail:
    from: ${MAIL_FROM:no-reply@promora.local}
  storage:
    local-dir: ${STORAGE_DIR:./data/uploads}
  payment:
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  ai:
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
---
spring:
  config:
    activate:
      on-profile: dev
promora:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-0123456789}
  hash-salt: ${HASH_SALT:dev-salt}
  auth:
    expose-dev-tokens: true
  seed-demo-data: ${SEED_DEMO_DATA:true}
