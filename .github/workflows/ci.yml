name: Promora CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend – Java 21, Maven and PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify Docker for Testcontainers
        run: docker version

      - name: Run backend unit and integration tests
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress --show-version clean verify

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promora-backend-test-reports
          if-no-files-found: warn
          retention-days: 14
          path: backend/target/surefire-reports/**

  frontend-checks:
    name: Frontend – typecheck, unit tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

  end-to-end:
    name: Browser – Playwright marketplace E2E
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start isolated application stack
        env:
          SPRING_PROFILES_ACTIVE: dev
          SEED_DEMO_DATA: 'true'
          DB_PASSWORD: promora
          JWT_SECRET: ci-promora-jwt-secret-at-least-32-characters-long-0123456789
          HASH_SALT: ci-promora-hash-salt
          PUBLIC_URL: http://localhost:5173
          API_URL: http://localhost:5173
          CORS_ORIGINS: http://localhost:5173
        run: docker compose up --build --detach

      - name: Wait for backend and frontend
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null &&
               curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              echo "Promora backend and frontend are ready."
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Run Playwright end-to-end suite
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npm run e2e

      - name: Capture application logs
        if: always()
        run: docker compose logs --no-color > promora-compose-logs.txt

      - name: Upload Playwright results and stack logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promora-e2e-results
          if-no-files-found: warn
          retention-days: 14
          path: |
            frontend/test-results/**
            frontend/playwright-report/**
            promora-compose-logs.txt

      - name: Stop application stack
        if: always()
        run: docker compose down --volumes --remove-orphans
